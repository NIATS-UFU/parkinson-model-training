[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinson-spiral"
version = "1.0.0"
description = "Cross-dataset robustness of spiral classifiers for Parkinson's disease diagnosis — paper reproduction code"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "NIATS-UFU" }]

# Layer-1 baseline: regenerating the paper's tables/figures from local results
# only needs these. The deep-learning pipelines pull torch/tensorflow on
# demand for Layer-2 re-training (see the [train] extra and docs/REPRODUCE.md).
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.3",
    "pyarrow==24.0.0",
    "scikit-learn==1.9.0",
    "scikit-image==0.26.0",
    "pillow==12.2.0",
    "tabulate==0.10.0",        # pandas.DataFrame.to_markdown
    "threadpoolctl==3.6.0",    # fixed NCA thread count in dogan_triple; already pulled in by scikit-learn
    "scipy==1.17.1",           # exact McNemar and chi-squared quantiles in evaluation; already pulled in by scikit-learn
]

[project.optional-dependencies]
# Re-training from scratch (Layer 2). Install: pip install -e ".[train]"
train = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "timm==1.0.22",
    "tensorflow==2.21.0",     # Folador 1D-CNN + Dogan NASNetMobile (faithful reproductions)
    "tqdm==4.67.1",
]
# Publishing the released model to the Hugging Face Hub. Install: pip install -e ".[hf]"
hf = [
    "skops==0.13.0",
    "huggingface_hub==1.2.3",
]
# Drawing the t-SNE figure (`paper.py distances --figure`). Install: pip install -e ".[figures]"
figures = [
    "matplotlib==3.10.9",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
