[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinson-spiral"
version = "1.0.0"
description = "Cross-dataset robustness of spiral classifiers for Parkinson's disease diagnosis — paper reproduction code"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NIATS-UFU" }]

# Layer-1 baseline: regenerating the paper's tables/figures from local results
# only needs these. The deep-learning pipelines pull torch/tensorflow on
# demand for Layer-2 re-training (see the [train] extra and docs/REPRODUCE.md).
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "pillow>=10.0",
    "tabulate>=0.9",        # pandas.DataFrame.to_markdown
]

[project.optional-dependencies]
# Re-training from scratch (Layer 2). Install: pip install -e ".[train]"
train = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9",
    "tensorflow>=2.13",     # Folador 1D-CNN + Dogan NASNetMobile (faithful reproductions)
    "tqdm>=4.65",
]
# Publishing the released model to the Hugging Face Hub. Install: pip install -e ".[hf]"
hf = [
    "skops>=0.9",
    "huggingface_hub>=0.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
