# Repository tooling only: linting, formatting and pre-commit hooks.
# The paper's package, its dependencies and its lockfile live in paper_reproduction/.

[project]
name = "parkinson-model-training"
version = "0"
description = "Tooling for the repository; the paper's code is in paper_reproduction/"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
  {name = "Fernando Andreotti", email = "andreotti@ufu.br"},
  ]
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    # Release
    "commitizen>=4",

    # Linting and formatting
    "ruff>=0.8",
    "pre-commit>=4",
]

[tool.uv]
# Nothing is built or installed from the repository root.
package = false

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true
preview = true

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "W",  # pycodestyle warnings
  "I",  # isort
  "B",  # flake8-bugbear
  "UP", # pyupgrade
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I002"]

[project.urls]
Repository = "https://github.com/NIATS-UFU/parkinson-model-training"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
annotated_tag = true
incremental = true
update_changelog_on_bump = true
check_consistency = true

  [tool.commitizen.change_type_map]
  feat = "Feat"
  fix = "Fix"
  perf = "Performance"
  refactor = "Refactor"
  docs = "Docs"
